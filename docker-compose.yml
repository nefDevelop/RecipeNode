services:
  recipernode:
    build: .
    container_name: reciperNode
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-8214}
      - DATA_DIR=/app/data
      - RECIPES_DIR=/app/recetas
      # Tras proxy TLS: COOKIE_SECURE=1 y TRUST_PROXY=1 en .env
    ports:
      - "${PORT:-8214}:8214"
    volumes:
      # Fuera del contenedor: host:contenedor. Relativas por defecto,
      # sobreescribibles con DATA_PATH / RECIPES_PATH en .env.
      - ${DATA_PATH:-./data}:/app/data
      - ${RECIPES_PATH:-./recetas}:/app/recetas
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8214/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
